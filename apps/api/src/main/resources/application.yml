spring:
    application:
        name: api

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acme_dev}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:sokmeak1376}
        hakari:
            pool-namea: acme-invoice-pool
            maximum-pool-size: 10

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    port: ${SERVER_PORT:8080}

acme:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
        # HS256 secret; must be at least 256 bits. Override via env var in every real environment.
        secret: ${JWT_SECRET:this-is-a-development-only-secret-key-change-me-please-1234567890}
        access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
        refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:10}

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true
    health:
        livenessstate:
            enabled: true
        readinessstate:
            enabled: true

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html

logging:
    level:
        com.acme.invoice: INFO
        org.springframework.security: INFO
