services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acme_invoice}
      POSTGRES_USER: ${POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-acme} -d ${POSTGRES_DB:-acme_invoice}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: ./apps/core-api
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-acme_invoice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-acme}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  back-office-portal:
    build:
      context: .
      dockerfile: apps/back-office-portal/Dockerfile
      args:
        # Stage 1 talks to DummyJSON directly, not core-api — see apps/back-office-portal/AGENTS.md.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://dummyjson.com}
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash}
    ports:
      - "${BACK_OFFICE_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  customer-portal:
    build:
      context: .
      dockerfile: apps/customer-portal/Dockerfile
    ports:
      - "${CUSTOMER_PORTAL_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
    # No host ports published here — core-api always reaches MinIO over the
    # compose network at http://minio:9000. Local dev gets host access via
    # docker-compose.override.yml (auto-loaded); prod deliberately has none.
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-angkor-commerce-media}
      # Scoped credentials the app uses at runtime — never the MinIO root user/password.
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-angkor-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-change_me_app_secret}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing "local/$${MINIO_BUCKET}";
      mc anonymous set download "local/$${MINIO_BUCKET}";
      mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}";
      printf "%s" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${MINIO_BUCKET}\",\"arn:aws:s3:::$${MINIO_BUCKET}/*\"]}]}" > /tmp/app-policy.json;
      mc admin policy create local angkor-app-rw /tmp/app-policy.json;
      mc admin policy attach local angkor-app-rw --user="$${MINIO_APP_ACCESS_KEY}" || true;
      echo "MinIO bucket initialized: $${MINIO_BUCKET} (app key: $${MINIO_APP_ACCESS_KEY}, scoped to bucket only)";
      '
volumes:
  postgres-data:
  minio-data:
